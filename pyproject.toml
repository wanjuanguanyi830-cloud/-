[project]
name = "taiyi-terminology-rules"
version = "0.1.0"
description = "Source-limited Taiyi terminology and rule modules"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["kintaiyi*", "rules*"]

[tool.setuptools.package-data]
rules = ["taiyi_v1.json", "jinjing_v4_military.json"]
"rules.jinjing.geju" = ["ruleset.json"]
"rules.variants" = ["modern_liunian_nayin.json"]

