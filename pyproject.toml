[project]
name = "taiyi-terminology-rules"
version = "0.1.0"
description = "Source-limited Taiyi terminology and rule modules"
requires-python = ">=3.10"
dependencies = ["astronomy-engine>=2.1.19,<3", "lunar_python>=1.4.8,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["kintaiyi*", "rules*", "terminology*", "registry*", "schemas*"]

[tool.setuptools.package-data]
rules = ["*.json"]
"rules.jinjing.geju" = ["ruleset.json"]
"rules.variants" = ["*.json"]
terminology = ["*.json"]
registry = ["*.json"]
schemas = ["*.json"]
